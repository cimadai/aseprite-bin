name: Build Aseprite for Windows

on:
  # GitHub Actions画面から手動実行
  workflow_dispatch:

  # 必要ならpush時にもビルド
  # push:
  #   branches:
  #     - main

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # Checkout
      # laf を含むsubmoduleが必要
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Ninja
      # Aseprite公式で使われているAction
      # ------------------------------------------------------------
      - name: Install Ninja
        uses: aseprite/get-ninja@main

      # ------------------------------------------------------------
      # MSVC環境
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # ------------------------------------------------------------
      # Asepriteのlafが要求しているSkiaバージョンを取得
      #
      # laf/misc/skia-url.sh が
      # aseprite/skia の適切なWindows Release x64版を返す
      # ------------------------------------------------------------
      - name: Download Skia
        shell: bash
        run: |
          set -euxo pipefail

          this_dir=$(cygpath "${{ github.workspace }}")

          skia_url=$(source "$this_dir/laf/misc/skia-url.sh" release windows x64 | xargs)
          skia_file=$(basename "$skia_url")

          echo "Skia URL: $skia_url"
          echo "Skia file: $skia_file"

          curl --ssl-revoke-best-effort \
            -L \
            --fail \
            --retry 3 \
            -o "$skia_file" \
            "$skia_url"

          mkdir -p skia
          unzip -q "$skia_file" -d skia

          echo "Skia downloaded."

      # ------------------------------------------------------------
      # CMake
      # Aseprite公式のWindows GUIビルド相当
      # ------------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build --target aseprite

      # ------------------------------------------------------------
      # 最低限の生成物確認
      # ------------------------------------------------------------
      - name: Verify
        shell: pwsh
        run: |
          if (!(Test-Path "build/bin/aseprite.exe")) {
            Write-Error "build/bin/aseprite.exe was not generated."
            exit 1
          }

          Write-Host "Aseprite executable:"
          Get-Item "build/bin/aseprite.exe" |
            Format-List Name, Length, LastWriteTime

          Write-Host ""
          Write-Host "build/bin contents:"
          Get-ChildItem "build/bin" -Recurse |
            Select-Object FullName, Length

      # ------------------------------------------------------------
      # 配布用ZIPを作成
      # build/bin 内にはexeだけではなく、
      # Asepriteのdata等も生成されるためbin全体を固める
      # ------------------------------------------------------------
      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageDir = "package/aseprite-windows-x64"

          New-Item -ItemType Directory `
            -Force `
            -Path $packageDir | Out-Null

          Copy-Item `
            -Path "build/bin/*" `
            -Destination $packageDir `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$packageDir/*" `
            -DestinationPath "aseprite-windows-x64.zip" `
            -Force

          Get-Item "aseprite-windows-x64.zip" |
            Format-List Name, Length

      # ------------------------------------------------------------
      # GitHub Actions Artifact
      # ------------------------------------------------------------
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-x64
          path: aseprite-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
